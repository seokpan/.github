<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="716" viewBox="0 0 1000 716" role="img" aria-labelledby="title desc"><title id="title">석판 1차 프로젝트 전체 구성</title><desc id="desc">브라우저의 요청은 HAProxy와 Gateway를 거쳐 Kubernetes의 Frontend 및 Backend에 도달한다. Backend는 Redis와 별도 VM의 MaxScale·MariaDB를 사용한다. Jenkins·Argo CD, 관측성과 외부 기반 서비스를 별도로 표시한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60738e"/></marker></defs><rect width="1000" height="716" rx="18" fill="#f7f9fc"/><text x="32" y="45" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="27" font-weight="700" fill="#14253f">석판 1차 프로젝트 전체 구성</text><text x="32" y="75" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#435570">물리 호스트 4대 · VM 16대 / 서비스 경로와 운영 구성</text><rect x="32" y="271" width="600" height="291" rx="12" fill="#eaf1ff" stroke="#a9bee5"/><text x="52" y="299" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">Kubernetes · Control Plane 3대 / Worker 2대</text><rect x="657" y="271" width="311" height="291" rx="12" fill="#fff7ed" stroke="#e8c9a3"/><text x="677" y="299" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#9a4b0a">별도 VM · 데이터 서비스</text><path d="M 444 173 H 555" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 758 217 V 243 H 45 V 339 H 58" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 174 369 V 392 H 183 V 404" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 174 392 H 469 V 404" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 469 464 V 481 H 183 V 493" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 434 H 669" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 819 465 V 500" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="32" y="114" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#52647d">사용자 요청</text><rect x="32" y="136" width="412" height="81" rx="12" fill="#ffffff" stroke="#c5d2e4"/><rect x="32" y="150" width="4" height="28" rx="2" fill="#2563eb"/><text x="50" y="168" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#2563eb">브라우저</text><text x="50" y="196" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#263a54">HTTPS / WSS</text><rect x="555" y="136" width="413" height="81" rx="12" fill="#ffffff" stroke="#c5d2e4"/><rect x="555" y="150" width="4" height="28" rx="2" fill="#9a4b0a"/><text x="573" y="168" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#9a4b0a">HAProxy LB · 별도 VM 1대</text><text x="573" y="196" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#263a54">외부 요청 진입점</text><rect x="58" y="309" width="248" height="60" rx="12" fill="#ffffff" stroke="#c5d2e4"/><rect x="58" y="323" width="4" height="28" rx="2" fill="#2563eb"/><text x="76" y="341" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#2563eb">Gateway</text><rect x="58" y="404" width="248" height="60" rx="12" fill="#ffffff" stroke="#c5d2e4"/><rect x="58" y="418" width="4" height="28" rx="2" fill="#2563eb"/><text x="76" y="436" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#2563eb"