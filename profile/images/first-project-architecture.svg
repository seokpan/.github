<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="589" viewBox="0 0 1000 589" role="img" aria-labelledby="title desc"><title id="title">석판 1차 프로젝트 실행 구성</title><desc id="desc">사용자 브라우저에서 접속한다. Kubernetes VM 5대 안에서 Gateway, Frontend, Backend, Redis, 배포 도구와 관측 도구가 실행된다. 별도 VM 11대에는 HAProxy, MaxScale 및 MariaDB, 네트워크와 기반 서비스가 있다.</desc><rect width="1000" height="589" rx="16" fill="#f8fafc"/><text x="32" y="44" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="27" font-weight="700" fill="#17253b">석판 1차 프로젝트 실행 구성</text><text x="32" y="74" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#4b5e78">물리 호스트 4대 · VM 16대  /  Kubernetes 내부 5대 · 별도 VM 11대</text><rect x="32" y="101" width="936" height="62" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="51" y="126" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#52647d">사용자</text><text x="51" y="149" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#17253b">브라우저 · HTTPS / WSS 접속</text><rect x="32" y="180" width="604" height="380" rx="10" fill="#edf2ff" stroke="#b8c7e3"/><text x="51" y="214" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1657a2">Kubernetes · VM 5대</text><text x="51" y="239" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#263a54">Control Plane 3대 · Worker 2대</text><rect x="51" y="255" width="566" height="59" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="69" y="291" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#163b76">Gateway · 클러스터 요청 진입</text><rect x="51" y="326" width="272" height="69" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="69" y="353" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#163b76">Frontend · 2개</text><text x="69" y="379" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#263a54">서비스 화면</text><rect x="345" y="326" width="272" height="69" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="363" y="353" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#163b76">Backend · 2개</text><text x="363" y="379" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#263a54">API · 게임 처리</text><rect x="51" y="407" width="566" height="53" rx="10" fill="#e6f6f0" stroke="#a9d5c6"/><text x="69" y="440" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#086b62">Redis · 실행 중 상태 공유</text><rect x="51" y="473" width="272" height="67" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="69" y="500" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#163b76">배포</text><text x="69" y="526" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#263a54">Jenkins · Argo CD</text><rect x="345" y="473" width="272" height="67" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="363" y="500" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#163b76">관측</text><text x="363" y="526" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#263a54">Metrics · Logs · Alerts</text><rect x="654" y="180" width="314" height="380" rx="10" fill="#fff6ea" stroke="#e5cba9"/><text x="672" y="214" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#946018">별도 VM · 11대</text><rect x="672" y="255" width="278" height="59" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="690" y="282" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#946018">접속 · 1대</text><text x="690" y="308" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#263a54">HAProxy LB</text><rect x="672" y="326" width="278" height="134" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="688" y="354" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#946018">데이터 · 3대</text><text x="688" y="386" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="17" font-weight="400" fill="#263a54">MaxScale 1대</text><text x="688" y="412" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="17" font-weight="400" fill="#263a54">MariaDB 2대</text><text x="688" y="441" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#52647d">DB 접속 · TLS</text><rect x="672" y="473" width="278" height="77" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="690" y="499" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#946018">기반 · 7대</text><text x="690" y="522" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#263a54">vRouter 4 · Ansible</text><text x="690" y="542" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#263a54">Harbor · NFS</text></svg>