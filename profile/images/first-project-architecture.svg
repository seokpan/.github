<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="686" viewBox="0 0 1000 686" role="img" aria-labelledby="title desc"><title id="title">석판 1차 프로젝트 전체 구성</title><desc id="desc">브라우저의 요청은 HAProxy와 Gateway를 거쳐 Kubernetes의 Frontend 및 Backend에 도달한다. Backend는 Redis와 별도 VM의 MaxScale·MariaDB를 사용한다. Jenkins·Argo CD, 관측성과 외부 기반 서비스를 별도로 표시한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60738e"/></marker></defs><rect width="1000" height="686" rx="16" fill="#f8fafc"/><text x="32" y="45" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="27" font-weight="700" fill="#14253f">석판 1차 프로젝트 전체 구성</text><text x="32" y="75" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#435570">물리 호스트 4대 · VM 16대 / 서비스 경로와 운영 구성</text><rect x="32" y="238" width="615" height="430" rx="10" fill="#eaf1ff" stroke="#a9bee5"/><text x="52" y="266" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">Kubernetes</text><text x="52" y="287" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#42526b">Control Plane 3대 · Worker 2대</text><rect x="672" y="238" width="296" height="430" rx="10" fill="#fff7ed" stroke="#e8c9a3"/><text x="692" y="267" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#9a4b0a">별도 VM 서비스</text><text x="692" y="290" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#42526b">DB 접속은 MaxScale · TLS 경유</text><path d="M 281 153 H 350" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 500 188 V 309" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" stroke-linecap=